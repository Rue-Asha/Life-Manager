name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-tag:
    name: check-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches package.json version
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  gate:
    needs: check-tag
    uses: ./.github/workflows/gate.yml
    with:
      runner: '["ubuntu-24.04"]'

  publish:
    name: publish
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: dist

      - name: Verify checksum
        working-directory: dist
        run: sha256sum -c ./*.sha256

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/*.tgz.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

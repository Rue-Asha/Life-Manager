version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @sveltejs/kit and svelte-check cap their typescript peer at ^6; drop this once they allow 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

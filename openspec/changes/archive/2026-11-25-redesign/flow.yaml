wave10_carry: |
  From U16/U17 reports (2026-11-23), brief the named units:
  - U19: ListGroup draws hairlines between sprint rows; signed By-aspect rows are separate tiles with a gap: decide the AspectView container. setQuickAddContext is optional (layout derives it from the route); snippet: $effect(() => setQuickAddContext({ destination: 'sprint' })).
  - U22: optional setQuickAddContext({ aspectId: data.aspect.id }).
  - All page units: avoid :global(.menu), .item, .glyph in page CSS (primitive class names; WeekView's :global(.menu) broke PopMenu, inner class renamed menu-list). Unlifted pages get a CSS fallback block in (app)/+layout.svelte; each lifted screen (with .screen-head) drops out; U26 deletes the block.
  - U18 or U26: Toast is self-rendering and body-portalled (no Toaster mounted); recheck "Toast does not cover the pill bar" with the real dock.
  - U26 polish: src/app.html viewport lacks interactive-widget=resizes-content (Android soft keyboard overlays sheets).
  - Signed-hi-fi deviations to show Rue at Gate 2: ConfirmDialog keeps role=dialog (hi-fi alertdialog); archived-class editor has no Delete (todos spec) while the hi-fi keeps it; route-error links keep plain labels per contract; More hub New todo is size s (40 px) to align with links.
wave10_rue: 'Rue, 2026-11-23, wave-10 fidelity pass: (1) the More hub /menu is reachable at every width, no redirect from 768 (supersedes the gate-1 P5 /menu redirect); two columns from 1280 per Q11; the top-bar More dropdown stays as the quick way. (2) Phone More opens the hub page as the contract says; the signed 375 dropdown (shell menu-open/attention) is not built, those pairs become unpaired with that reason. 404 explainer cards in the hi-fi are gallery annotations, not a deviation.'

wave12_carry: |
  From U21/U22/U23 reports (2026-11-23), for the W12 fixer unless noted:
  - Flaky: e2e/overlay-motion.test.ts "Menus and sheets open softly" failed on timing in three units (menu 244-301 ms vs 240; sheet 303 vs 300) and today.test.ts "A todo added on Today settles in and ticking stays instant" once; make both robust (assert the configured duration/easing or a tolerance, not wall-clock under load).
  - U21 skipped mobile-native and break-ui: the W12 fixer runs both on Backlog and Welcome (320/375, 44 px, soft keyboard, worst data).
  - Contract/spec sync: /aspects delete target is a labelled select "Move them to" with no preselection (contract §5 says radios, first preselected); aspect Details card at 768-1279 sits above the lists (delta says "stacked below"); aspect-page Backlog inline add is the signed inline form (delta "opens quick add in the Backlog section" is stale); icon set has 24 glyphs (contract/hi-fi say 25).
  - copy.ts: fold U22's hard-coded strings ("Couldn't save the order — try again.", "Goes to the backlog, aspect <name>", "Choose an aspect", "Move them to", "Show full title"/"Show less", the delete messages incl. "Move 1 rule and delete").

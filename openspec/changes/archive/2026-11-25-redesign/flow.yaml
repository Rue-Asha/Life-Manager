track: feature
triage: "feature — from-scratch UI redesign on the fingerprint (ecosystem-ui-revamp section 13, gates 3-8), all routes in one change. Appetite: several sessions, in phases (gate 4 wireframes, gate 5 hi-fi, then the build in waves)."
base: main
gate0: 2026-11-17
gate1: 2026-11-17
gate5: 2026-11-22
gate2: 2026-11-25
gate5_decisions: 'Rue signed gate 5 on 2026-11-22: icon B Beads; planner Q12 copy (cf2b63a) accepted as is; control-review high finding (More menu clips the long aspect name) fixed before the freeze, every medium/low control finding carried to the build as polish with an owning unit; tag gate5-signed only after that fix is merged and proof:full is green.'
learnings:
  - "Redesign mockups can't sit under the existing root layout: its old tokens.css names (--surface, --ink, --accent) clash with the fingerprint and it redirects to /welcome when there are no aspects; Life had no (app) group, so the plan moves every app route into src/routes/(app)/ (A1)."
  - 'Mobbin flow searches return many images per result and flood a builder context; brief limit 1-2 per search after the first, and expect screen ids matched by position to be approximate (U2).'
  - 'sync.sh appends the scratchpad symlink path to Design-System apps.txt, which is untracked and full of stale scratchpad lines from earlier sessions; the canonical path has to be set by hand at the hand-over (U1).'
  - 'impeccable detect and the Playwright MCP find no Chrome on this machine; U3 fell back to repo Playwright scripts. Brief UI units with IMPECCABLE_BROWSER pointed at Playwright chromium or name the repo scripts up front (U3).'
  - 'U3 first replaced impeccable critique/polish with a manual look and committed a tools file on a red svelte-check hidden by `| tail`; the brief must say critique runs as a command and checks run pipefail-safe (U3).'
  - 'Three of four wireframe builders ran impeccable critique degraded (detector only, or A inline) and had to be sent back; brief Assessment B explicitly as repo-Playwright browser measurements (targets, contrast, names, h1, ids, selectable chrome) in an isolated sub-agent, and name mobile-native and break-ui as Skill-tool loads (U4, U5, U6).'
  - 'getBoundingClientRect target sweeps miss pseudo-element hit areas (.wf-check::before); measure the hit area via elementFromPoint or document the pseudo in the kit (U4, U5, U6).'
  - 'Mockup routes 404 unless the dev server runs with LM_TEST=1, and stale servers on the unit port survive interrupted runs; brief UI units with LM_TEST=1 and freeing the port first (U9).'
  - 'U9 again skipped critique/polish as commands and ran impeccable context without finding DESIGN.md; brief must say run it from the worktree root and list the expected files (PRODUCT.md, DESIGN.md, DESIGN.json) (U9).'
  - 'impeccable is not on PATH (run ~/.claude/skills/impeccable/scripts/impeccable) and the CLI has no critique/polish verbs; those are skill flows (A/B sub-agents, then fixes). Brief them as skill flows, not commands, so builders stop reporting them as skipped (U8, U9).'
  - 'U8 hi-fi uses env(safe-area-inset-*); U15 must add viewport-fit=cover to src/app.html or insets stay 0 on a real phone (U8).'
  - 'Parallel hi-fi units each built their own shared parts (U12 put FormSheet/Disclosure/TodoRow under hifi/project/, U11 its own Row/menu); the build units must consolidate them into src/lib/components instead of porting three copies (U10-U12).'
  - 'Vendored .screen-facts renders the figure at label size; three units flagged weak key-facts hierarchy — a Design-System requests.md item, not a per-app override (U10-U12).'
  - 'The 13.2 fresh-context reviewer hit an image request limit after ~81 of 690 shots and left sprint board/week, shell and most sub-states unseen; split the review into 2-3 reviewers by collection, each with a fixed shot list (U13).'
  - 'Hi-fi units did break-ui on page-level overflow only; the fresh review still found ~13 worst-case breaks (mid-word cuts, missing ellipsis, accent on cut fragments, clipped tags). Brief break-ui as reading every worst shot, not just the sweep result (U10-U12).'
  - 'Rue (2026-11-22) worried that what a gate shows is not what ships. The plan let builders self-check side-by-side and deleted the mockups (26.2) before Verify/Gate 2, so nothing could be compared at the end. Freeze the signed state and check fidelity independently per wave (U13).'
  - 'Gate-5 fixer round 4: two of the "still broken" findings (sprint rail missing at 1280, beige band on long phone pages) were artefacts of the shots harness (full-page capture replayed the settle animation; touch-posture full capture stopped painting below the first screen). When a finding survives several fixer rounds, check the capture harness before the UI (U13).'
  - 'Fixer could not stop a running proof:full (pkill denied) and had to wait ~17 min before rerunning at the final tip; each shots-based verify loop costs ~40 min. Brief fixers to run the single shots test for iteration and proof:full once at the end (U13).'
  - 'Icon template (Design-System icons/TEMPLATE.md) cannot fit seven 32-unit strokes with 32-unit gaps in its live area, so a "seven in a row" motif is impossible as briefed; check motif against the template grid before briefing an icon round (U13).'
  - 'Playwright MCP chrome was missing in the builder session, so builders screenshot with a local Playwright script and the fidelity pair images; pkill -f is denied, stop background runs with TaskStop (U16/U17).'
  - 'W13 (U24, U25): both builders wrote the new state scenarios after the lift and never saw them red; brief the red-first step as its own checkpoint for lift units (write the scenarios file, run it red, then lift).'
  - 'W13: parallel page units with the same hi-fi parts (Split, Disclosure, NotesCard) each built a copy; the planner should give shared hi-fi parts one owner in the earlier wave.'
  - 'W14 (U26): the a11y floor passed while the hardening broke behaviour (scroll-padding from sticky vars scrolled the page behind overlays; a hit-area extension took taps from the row above); a11y-floor briefs need behavioural scenarios (scroll position kept, a click near the edge hits its own target), and the regression design pass needs a pre-unit baseline build.'
  - 'W14 fixer loaded impeccable but skipped its critique/polish passes on narrow CSS fixes; the brief should say which skill steps are mandatory for a fixer.'
  - 'Verify fixer r2: a subagent gets no background completion notice while it is mid-turn, so it bridged proof:full with foreground sleep loops against the rule; the proof procedure for subagents needs a sanctioned wait (end the turn and resume, or a foreground run with the 600 s cap split).'
gate5_polish_candidates: |
  From the late round-3 Assessment B (pre-fix tree, partial: aspect..projects only) — carry to the build unless fixed earlier, owner in brackets:
  - h1 descenders clipped ~3 px (scrollHeight 47 vs 44) on ~95 hi-fi pages by the title clamp [U15 primitives / U16 shell].
  - div.app scrollWidth 439 vs 375 with clipped overflow at 375: ~64 px hidden off-canvas child, not traced [U16 shell].
  - toast fixed over the dock overlaps the round "+" (44x42) while shown [U17 overlays].
  - projects/empty?data=worst buttons 26-29 px tall at 375 (did not reproduce in the fixer's own sweep; recheck) [U24].
  - 'Fixer rounds 1-3 kept reporting items fixed that the next fresh review still saw (rail at 1280, calendar cells, editor chips): fixers verify on their own dev shots, reviewers on the proof shots. Make the fixer read the proof:full shots of each finding, not ad-hoc screenshots (U13).'
  - 'Rue answered 14 gate-5 taste questions interactively from a published gallery artifact in one sitting; four AskUserQuestion rounds with a recommendation first worked well (U13).'

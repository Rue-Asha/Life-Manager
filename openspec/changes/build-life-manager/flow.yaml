triage: "feature — new app from scratch, new data model, home-server deploy target, multi-session. Appetite: 5–7 sessions."
base: main
gate0: 2026-10-03
gate1: 2026-10-03
gate2: 2026-10-03
learnings:
  - "Mobbin: a search for an app it doesn't have silently returns other apps — check app names in results before citing"
  - "Mobbin: flow screens come back as IDs without URLs — cite the flow URL + screen ID"
  - "Mobbin: results carry image previews even at low limits — keep design research in a subagent, never the main session"
  - "repo-setup.md config snippet: the tasks rule containing ': ' must be single-quoted, else YAML makes it a mapping and openspec silently drops all tasks rules"
  - "openspec validate returns 'Unknown item' unless run from the repo root — briefs should say cwd = repo root"
  - "SvelteKit 3: no svelte.config.js (build fails config_file_unsupported) — kit options go in vite.config.ts sveltekit({...}); tsconfig extends $app/tsconfig"
  - "Shell aliases rm/mv are interactive (-i) and hang agents — use `command rm -f` / `command mv -f`"
  - "pkill -f with a pattern matching the agent's own command line kills its shell — bound dev servers with `timeout` instead"
  - "jq rewrites package.json with 2-space indent — use `jq --tab` to keep npm's format"
  - "flow-unit symlinks node_modules to the main repo — a unit that installs or generates into it (e.g. .svelte-kit/$app tsconfig) leaks into every worktree; units that change deps must `npm ci` locally first"
  - "SvelteKit 3 removed the $lib alias (now #lib via package.json imports) — decide the import style in the contract unit"
  - "fontsource variable fonts register as '<Family> Variable' — token font-family must use that name"
  - "SvelteKit 3 CSRF: a POST without content type and Origin gets 403 — e2e posting to form actions must send `origin: baseURL`"
  - "adapter-node 6 ignores runtime ORIGIN and assumes https — form actions 403 over plain http unless PROTOCOL_HEADER + X-Forwarded-Proto; set it in playwright.config.ts in the harness unit"
  - "SvelteKit 3 enhance: update() resets the form and clears bind:group radios → update({ reset: false }); SubmitFunction comes from $app/forms; `cp` is also aliased interactive"
  - "e2e after client-side navigation: wait for URL or heading before the next locator, else it matches the old page"
  - "zsh: an unmatched glob aborts the whole command — name files explicitly in rm"
  - "flow orchestrator: /clear does not stop background subagents — check ListAgents before treating uncommitted edits as an interrupted agent's leftovers (a duplicate fixer was spawned)"
  - "Gate 2 correction: Rue expects the sprint to organise todos drawn from the aspects/backlog; scope modelled backlog and sprint as separate places with no aspect-side view — explore must check the user's mental model of how the core entities relate, not only the flows"
  - "Gate 2 correction: desktop view left mostly empty whitespace — design research and screenshots must judge wide layouts (≥1280) as seriously as mobile"
  - "Gate 2 correction: Rue wants more motion/transitions than the brief's 'motion only answers an action' stance — confirm the motion stance with Rue instead of letting the design agent set it"
review_log:

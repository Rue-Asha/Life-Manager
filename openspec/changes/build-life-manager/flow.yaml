  - "round 2 (reviewer at 4ebe184, fixer deeffa1): sidebar test → visits 6 screens, asserts aria-current moves; planning expectStarted → asserts sprint-week label; README build example → adds PROTOCOL_HEADER + note (adapter-node 6 can't do plain-http forms via env); recurring weekdays → integer 1–7 enforced; pullTodo/addToActiveSprint → only backlog (or draft) todos. Open for Gate 2: reviewer flagged the sprint-views Sunday spec rewrite as an orchestrator decision, not Rue's — Rue confirms or vetoes."
  - "Gate 2 (2026-10-03, Rue approved as-is): overdue ticked → struck through on the day ticked, confirmed; Sunday /sprint spec rewrite confirmed; Today Overdue group → update spec to match code; backlog Add to sprint on a review-required sprint → deferred to sprint-management S7."

track: feature
triage: 'feature — one-way sync of planned todos, recurring series and exams into Proton Calendar via proton-cli: sync-state migration, diff reconciler, status page; Homelab deploy split off. Appetite: three evenings'
base: main
gate0: 2026-10-18
gate1: 2026-10-18
gate2: 2026-10-18
ship_note: 'Rue at Gate 2 (2026-10-18): one extra fix round for the 6 open round-3 findings, then a short verify and back to Gate 2; ship = merge + tag v0.6.0'
learnings:
  - 'Planner on a background sync worker (subprocess + DB reconciler) → add scenarios for: pacing across consecutive passes, a pass that throws, domain writes (e.g. aspect delete) landing mid-pass, malformed subprocess output with exit 0, and error state clearing when an item matches again (weil: reviewer rounds 1 and 2 found 5 correctness bugs in exactly these paths while 300+ tests were green) [2026-10-18 · proton-calendar-sync]'
  - 'Fixer with several finding groups → one proof:full per commit group, never two commits off one run (weil: fixer round 1 committed two groups off one combined proof run after a red typecheck) [2026-10-18 · proton-calendar-sync]'
  - 'Builder of a test-only unit over merged code → still one commit per task (weil: U6 bundled 6.1–6.3 into one commit; fail-first held per task, but commits no longer map to tasks) [2026-10-18 · proton-calendar-sync]'
  - 'e2e on /sync or any page in a fresh DB → seed an aspect first (weil: no aspects redirects to /welcome; U5 lost a run on it) [2026-10-18 · proton-calendar-sync]'
  - 'Builders running vitest or proof:full output → `node_modules/.bin/vitest run <file>` (never bare `npx vitest`, it starts watch mode and hangs past 120s), and read only exit code + tail of a background proof log (weil: U4 hung on npx vitest; U2 read a whole proof:full log and burned ~27k tokens) [2026-10-18 · proton-calendar-sync]'
  - 'Builder shells chaining `cd <worktree> && …` with several heredocs → use absolute paths in every redirect (weil: a failed cd let later `cat > x.ts` lines write 5 stubs into the primary checkout) [2026-10-18 · proton-calendar-sync]'
  - 'Builder writing a test double (fake CLI) → test first still applies; the brief names the fail-first check for the double itself (weil: U1 wrote the fake before its test and had to move it away to stage the red step) [2026-10-18 · proton-calendar-sync]'
  - 'Explore for an integration with an external CLI → pin exact argv (command nouns, flag spellings, enum values like colour tables) in scope.md, not only semantics and output (weil: the planner stopped at needs-human on unpinned `proton` argv and accent hex values although the research agent had read them) [2026-10-18 · proton-calendar-sync]'
